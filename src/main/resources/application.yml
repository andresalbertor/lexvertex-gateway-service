# Bootstrap mínimo. Catálogo de negocio (rutas, CORS, JWKS, Eureka, management):
# Config Server JDBC → lex_config.PROPERTIES (PROFILE=dev|prod). No duplicar aquí.
spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
  r2dbc:
    # Credenciales de proceso; no reutilizar DB_URL (JDBC). Gateway usa r2dbc.
    url: ${R2DBC_URL:r2dbc:mysql://localhost:3306/lex_core?allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:lex_app}
    password: ${DB_PASSWORD:}
