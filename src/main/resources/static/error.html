<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lex Vertex">
    <title>{{status}} — {{title}} | Lex Vertex</title>
    <style>
        :root {
            --primary: #123a5c;
            --primary-dark: #0b2740;
            --primary-light: #3f6485;
            --secondary: #a23b5a;
            --bg: #f8fafc;
            --bg-page: #f4f6f9;
            --paper: #ffffff;
            --text: #16202b;
            --text-secondary: #4d5d6c;
            --muted: #64748b;
            --border: #e2e8f0;
            --panel-muted: #cbd5e1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        @media (min-width: 900px) {
            body { flex-direction: row; }
        }
        .panel-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.25rem;
            background: var(--bg);
        }
        @media (min-width: 900px) {
            .panel-form { background: var(--paper); padding: 3rem; }
        }
        .form-wrap {
            width: 100%;
            max-width: 24rem;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.5rem;
            background: var(--primary-dark);
            color: #fff;
            flex-shrink: 0;
        }
        .brand-mark svg { width: 1.35rem; height: 1.35rem; fill: currentColor; }
        .brand-name {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary-dark);
        }
        .card {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--paper);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            padding: 1.75rem 1.5rem;
        }
        @media (min-width: 600px) {
            .card { padding: 2rem; }
        }
        .code {
            margin: 0 0 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--primary-dark);
            letter-spacing: -0.01em;
        }
        .message {
            margin: 0.75rem 0 0;
            font-size: 0.875rem;
            line-height: 1.55;
            color: var(--text-secondary);
        }
        .actions { margin-top: 1.75rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            transition: background-color 0.15s ease;
        }
        .btn:hover { background: var(--primary-dark); }
        .legal {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
        }
        .panel-brand {
            display: none;
        }
        @media (min-width: 900px) {
            .panel-brand {
                display: flex;
                flex: 1;
                width: 50%;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                padding: 3rem;
                color: #fff;
                background: linear-gradient(135deg, #0b2740 0%, #123a5c 50%, #0b2740 100%);
                border-left: 4px solid var(--secondary);
                position: relative;
                overflow: hidden;
            }
        }
        .panel-brand-inner {
            max-width: 28rem;
            text-align: center;
        }
        .panel-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .panel-icon svg { width: 2.75rem; height: 2.75rem; fill: #fff; }
        .panel-title {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .panel-sub {
            margin: 0.75rem 0 0;
            font-size: 1rem;
            font-weight: 400;
            color: var(--panel-muted);
        }
    </style>
</head>
<body>
    <section class="panel-form" aria-label="Error">
        <div class="form-wrap">
            <a class="brand" href="{{home_href}}">
                <span class="brand-mark" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M1 21h12v2H1v-2zM5.24 8.07l2.83-2.83 14.14 14.14-2.83 2.83L5.24 8.07zM12.32 1l5.3 5.3L15.16 8.7l-5.3-5.3L12.32 1zM3.83 9.48l5.3 5.3-2.12 2.12-5.3-5.3 2.12-2.12z"/>
                    </svg>
                </span>
                <span class="brand-name">Lex Vertex</span>
            </a>

            <div class="card">
                <p class="code">Error {{status}}</p>
                <h1>{{title}}</h1>
                <p class="message">{{message}}</p>
                <div class="actions">
                    <a class="btn" href="{{home_href}}">Inicio</a>
                </div>
            </div>

            <p class="legal">Lex Vertex Seguridad Legal © 2026.</p>
        </div>
    </section>

    <aside class="panel-brand" aria-hidden="true">
        <div class="panel-brand-inner">
            <div class="panel-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M1 21h12v2H1v-2zM5.24 8.07l2.83-2.83 14.14 14.14-2.83 2.83L5.24 8.07zM12.32 1l5.3 5.3L15.16 8.7l-5.3-5.3L12.32 1zM3.83 9.48l5.3 5.3-2.12 2.12-5.3-5.3 2.12-2.12z"/>
                </svg>
            </div>
            <h2 class="panel-title">LEX VERTEX</h2>
            <p class="panel-sub">Sistema de Gestión Jurídica</p>
        </div>
    </aside>
</body>
</html>
