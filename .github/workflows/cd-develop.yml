name: CD develop
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cd-${{ github.repository }}-develop
  cancel-in-progress: true
env:
  SERVICE: gateway-service
  HOSTINGER_PROJECT: lex-platform
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/andresalbertor/lexvertex
  VPS_VM_ID: ${{ vars.VPS_VM_ID != '' && vars.VPS_VM_ID || '2094330' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Compile and test
        run: |
          chmod +x ./gradlew
          ./gradlew check --no-daemon --no-configuration-cache
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - run: chmod +x ./gradlew && ./gradlew bootJar --no-daemon --no-configuration-cache
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ env.SERVICE }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ env.SERVICE }}:${{ github.sha }}
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy lex-platform
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          VPS_VM_ID: ${{ env.VPS_VM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HOSTINGER_API_TOKEN:-}" ]]; then
            curl -fsS -X POST "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VPS_VM_ID}/docker/lex-platform/update" -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" -H "Accept: application/json"; echo
          else
            curl -fsS -X POST -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/andresalbertor/lexvertex/dispatches -d '{"event_type":"split-deploy","client_payload":{"project":"lex-platform","mode":"update"}}'; echo
          fi
